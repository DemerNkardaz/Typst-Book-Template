[meta]
yal-min-version = "0.1.3"
post-commands = [
	"git init --initial-branch=main",
]
exclude = [
	".flake8",
	"typst.toml",
	"README.md",
	"LICENSE",
	"TODO.md"
]

[[fields]]
id             = "book-name"
type           = "text"
required       = true
default        = "{placeholder}"
is-folder-name = true

[[fields]]
id       = "book-author"
type     = "text"
required = false
default  = ""

[[fields]]
id       = "book-genre"
type     = "select"
required = false
options  = [
    "Fantasy",
		"Fiction",
    "Science Fiction",
    "Horror",
    "Mystery",
    "Thriller",
    "Romance",
    "Historical",
    "Adventure",
    "Western",
    "Crime",
    "Drama",
    "Comedy",
    "Satire",
    "Dystopian",
    "Utopian",
    "Young Adult",
    "Children’s",
		"Autobiography",
]
default  = ""
allow-custom = true

[[fields]]
id       = "book-genres"
type     = "multi-select"
required = false
options  = [
    "Action",
    "Adventure",
    "Comedy",
    "Drama",
    "Romance",
    "Mystery",
    "Psychological",
    "Political",
    "Military",
    "Epic",
    "Dark",
    "Urban",
    "High Fantasy",
    "Low Fantasy",
    "Sword and Sorcery",
    "Space Opera",
    "Hard Science Fiction",
    "Cyberpunk",
    "Steampunk",
    "Biopunk",
    "Post-Apocalyptic",
    "Supernatural",
    "Paranormal",
    "Gothic",
    "Survival",
    "Coming-of-Age",
    "Slice of Life",
    "Family",
    "Historical Fiction",
    "Philosophical",
    "Religious",
    "Mythological",
    "Noir",
    "Cozy",
    "Suspense",
    "Detective",
		"Novel",
		"Journal",
		"Diary",
		# Chinese
		"Wǔxiá",
		"Xiānxiá"
]
default  = []
allow-custom = true

[[fields]]
id						= "book-lang"
type					= "select"
required			= true
options				= [
	"en-US", "en-GB", "ru-RU", "uk-UA", "be-BY", "bg-BG", "kk-KZ",
	"de-DE", "de-CH", "fr-FR", "es-ES", "is-IS", "it-IT", "pt-BR",
	"el-GR", "zh-CN", "ja-JP", "ko-KR"
]
default				= "en-US"
allow-custom	= true

[messages]
book-name.prompt      = "Enter book title"
book-name.placeholder = "Untitled book"
book-author.prompt    = "Enter author name"
book-author.placeholder = "Anonymous"

book-lang.prompt      = "Select book locale  in ISO-639, ISO-3166 format"
book-lang.option.en-US = "English (United States)"
book-lang.option.en-GB = "English (United Kingdom)"
book-lang.option.ru-RU = "Русский (Россия)"
book-lang.option.uk-UA = "Українська (Україна)"
book-lang.option.be-BY = "Беларуская (Беларусь)"
book-lang.option.bg-BG = "Български (България)"
book-lang.option.kk-KZ = "Қазақша (Қазақстан)"
book-lang.option.de-DE = "Deutsch (Deutschland)"
book-lang.option.de-CH = "Deutsch (Schweiz)"
book-lang.option.fr-FR = "Français (France)"
book-lang.option.es-ES = "Español (España)"
book-lang.option.is-IS = "Icelandic (Iceland)"
book-lang.option.it-IT = "Italiano (Italia)"
book-lang.option.pt-BR = "Português (Brasil)"
book-lang.option.el-GR = "Ελληνικά (Ελλαδα)"
book-lang.option.zh-CN = "中文 (中国大陆)"
book-lang.option.ja-JP = "日本語 (日本)"
