[[targets]]
file   = "/meta/book.yml"
format = "yaml"

[[targets.fields]]
value = "${UUID}"
key   = "book.uuid"

[[targets.fields]]
field = "book-name"
key   = "book.title"

[[targets.fields]]
field = "book-author"
key   = "author[0].name"

[[targets.fields]]
field = "book-lang"
key   = "property.locale"

[[targets.fields]]
value = "© {book-author}"
key   = "copyright.notice"

[[targets.fields]]
field = "book-genre"
fallback = "${NULL}"
key   = "property.genre"

[[targets.fields]]
field = "book-genres"
fallback = "${NULL}"
key   = "property.genres"

