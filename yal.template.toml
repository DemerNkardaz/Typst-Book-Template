[meta]
yal-min-version = "0.1.3"
post-commands = [
	"git init --initial-branch=main",
]
exclude = [
	".flake8",
	"typst.toml",
	"README.md",
	"LICENSE",
	"TODO.md"
]

[[fields]]
id             = "book-name"
type           = "text"
required       = true
default        = "{placeholder}"
is-folder-name = true

[[fields]]
id       = "book-author"
type     = "text"
required = false
default  = ""

[[fields]]
id       = "book-genre"
type     = "select"
required = false
options  = [
    "Fantasy",
		"Fiction",
    "Science Fiction",
		"Science Fantasy",
    "Horror",
    "Mystery",
    "Thriller",
    "Romance",
    "Historical",
    "Adventure",
    "Western",
    "Crime",
    "Drama",
    "Comedy",
    "Satire",
    "Dystopian",
    "Utopian",
    "Young Adult",
    "Children’s",
		"Autobiography",
]
default  = ""
allow-custom = true
min-cols = 2

[[fields]]
id       = "book-genres"
type     = "multi-select"
required = false
options  = [
    "Action",
    "Adventure",
    "Comedy",
    "Drama",
    "Romance",
    "Mystery",
    "Psychological",
    "Political",
    "Military",
    "Epic",
    "Dark",
    "Urban",
    "High Fantasy",
    "Low Fantasy",
		"Technofantasy",
    "Sword and Sorcery",
    "Space Opera",
    "Hard Science Fiction",
		"Science Fantasy",
    "Cyberpunk",
    "Steampunk",
    "Biopunk",
    "Post-Apocalyptic",
    "Supernatural",
    "Paranormal",
    "Gothic",
    "Survival",
    "Coming-of-Age",
    "Slice of Life",
    "Family",
    "Historical Fiction",
		"Historical Fantasy",
    "Philosophical",
    "Religious",
    "Mythological",
    "Noir",
    "Cozy",
    "Suspense",
    "Detective",
		"Novel",
		"Journal",
		"Diary",
		# Chinese
		"Wǔxiá",
		"Xiānxiá"
]
default  = []
allow-custom = true
min-cols = 2

[[fields]]
id						= "book-lang"
type					= "select"
required			= true
options				= [
	"en-US", "en-GB", "ru-RU", "uk-UA", "be-BY", "bg-BG", "kk-KZ",
	"de-DE", "de-CH", "fr-FR", "es-ES", "is-IS", "it-IT", "pt-BR",
	"ro-RO", "el-GR", "zh-CN", "ja-JP", "ko-KR"
]
default				= "en-US"
allow-custom	= true
min-cols = 2

[[fields]]
id				= "book-add-params"
type			= "boolean"
required	= false
default		= false

[[fields]]
id = "book-isbn"
type = "text"
required = false
default = "978-5-0000-0000-0"
show-if = "book-add-params"

[[fields]]
id = "book-issn"
type = "text"
required = false
default = "0000-0000"
show-if = "book-add-params"

[messages]
book-name.prompt      = "Enter book title"
book-name.placeholder = "Untitled book"
book-author.prompt    = "Enter author name"
book-author.placeholder = "Anonymous"

book-lang.prompt      = "Select book locale  in ISO-639, ISO-3166 format"
book-lang.option.label.en-US = "English (United States)"
book-lang.option.label.en-GB = "English (United Kingdom)"
book-lang.option.label.ru-RU = "Русский (Россия)"
book-lang.option.label.uk-UA = "Українська (Україна)"
book-lang.option.label.be-BY = "Беларуская (Беларусь)"
book-lang.option.label.bg-BG = "Български (България)"
book-lang.option.label.kk-KZ = "Қазақша (Қазақстан)"
book-lang.option.label.de-DE = "Deutsch (Deutschland)"
book-lang.option.label.de-CH = "Deutsch (Schweiz)"
book-lang.option.label.fr-FR = "Français (France)"
book-lang.option.label.es-ES = "Español (España)"
book-lang.option.label.is-IS = "Íslenska (Ísland)"
book-lang.option.label.it-IT = "Italiano (Italia)"
book-lang.option.label.pt-BR = "Português (Brasil)"
book-lang.option.label.ro-RO = "Românește (Romania)"
