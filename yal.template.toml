[meta]
yal-min-version = "0.1.1"
post-commands = [
	"git init",
	"pip install pyyaml pikepdf pillow"
]
exclude = [
	".flake8",
	"typst.toml",
	"README.md",
	"LICENSE",
	"TODO.md"
]

[[fields]]
id             = "book-name"
type           = "text"
required       = true
default        = "{placeholder}"
is-folder-name = true

[[fields]]
id       = "book-author"
type     = "text"
required = false
default  = ""

[[fields]]
id       = "book-genre"
type     = "text"
required = false
default  = ""

[[fields]]
id       = "book-lang"
type     = "select"
required = true
default  = "en-US"

[messages]
book-name.prompt      = "Enter book title"
book-name.placeholder = "Untitled book"
book-author.prompt    = "Enter author name"
book-author.placeholder = "Anonymous"
book-lang.prompt      = "Select book locale  in ISO-639, ISO-3166 format"
book-genre.prompt     = "Enter book genre"

[messages.ru]
book-name.prompt      = "Введите название книги"
book-name.placeholder = "Книга без названия"
book-author.prompt    = "Введите имя автора"
book-author.placeholder = "Аноним"
book-lang.prompt      = "Выберите локализацию книги в формате ISO-639, ISO-3166"
book-genre.prompt     = "Введите жанр книги"

[[targets]]
file   = "/meta/book.yml"
format = "yaml"

[[targets.fields]]
value = "${UUID}"
key   = "book.uuid"

[[targets.fields]]
field = "book-name"
key   = "book.title"

[[targets.fields]]
field = "book-author"
key   = "author[0].name"

[[targets.fields]]
field = "book-lang"
key   = "property.locale"

[[targets.fields]]
value = "© {book-author}"
key   = "copyright.notice"

[[targets.fields]]
field = "book-genre"
fallback = "${NULL}"
key   = "property.genre"

# [[targets.fields]]
# value = "${NULL}"
# key   = "book.series"

# [[targets.fields]]
# value = "${NULL}"
# key   = "book.cycle"

# [[targets.fields]]
# value = "${NULL}"
# key   = "book.volume-title"

# [[targets.fields]]
# value = "${NULL}"
# key   = "book.volume"

# [[targets.fields]]
# value = "${NULL}"
# key   = "book.description"

[[targets.fields]]
value = "${YEAR}"
key   = "date.year"

[[targets.fields]]
value = "${MONTH}"
key   = "date.month"

[[targets.fields]]
value = "${DAY}"
key   = "date.day"
