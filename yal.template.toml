[[targets]]
file   = "/meta/book.yml"
format = "yaml"

[[targets.fields]]
value = "${UUID}"
key   = "book.uuid"

[[targets.fields]]
field = "book-name"
key   = "book.title"

[[targets.fields]]
field = "book-author"
key   = "author[0].name"

[[targets.fields]]
field = "book-lang"
key   = "property.locale"

[[targets.fields]]
value = "© {book-author}"
key   = "copyright.notice"

[[targets.fields]]
field = "book-genre"
fallback = "${NULL}"
key   = "property.genre"

[[targets.fields]]
field = "book-genres"
fallback = "${NULL}"
key   = "property.genres"

# [[targets.fields]]
# value = "${NULL}"
# key   = "book.series"

# [[targets.fields]]
# value = "${NULL}"
# key   = "book.cycle"

# [[targets.fields]]
# value = "${NULL}"
# key   = "book.volume-title"

# [[targets.fields]]
# value = "${NULL}"
# key   = "book.volume"

# [[targets.fields]]
# value = "${NULL}"
# key   = "book.description"

[[targets.fields]]
value = "${YEAR}"
key   = "date.year"

[[targets.fields]]
value = "${MONTH}"
key   = "date.month"

[[targets.fields]]
value = "${DAY}"
key   = "date.day"

[[targets.fields]]
field = "book-isbn"
key   = "property.ISBN"

[[targets.fields]]
field = "book-issn"
key   = "property.ISSN"
