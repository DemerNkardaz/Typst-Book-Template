[origin]
template = ""
template-version = ""
created-at = ""
yal-version = ""

[header]
name = "Typst Book Template"
version = "0.0.0"

[[command]]
name = "make"
arguments = {--mode = []}
script = "/build/build.py"
exec = "python3"

[[command]]
name = "make print"
macros = "make --mode=print"

[[command]]
name = "assets"
script = "/build/modules/assets.py"
exec = "python3"

[[command]]
name = "chapter"
script = "/code/.python/add-chapter.py"
exec = "python3"

[[command]]
name = "hello"
script = """
def greet():
    print("Привет из инлайн-скрипта!")
    print("Вторая строка вывода — для проверки многострочности.")

greet()
"""
exec = "python3"
