meta:
  yal-min-version: 0.1.3
  exclude:
    - .flake8
    - typst.toml
    - README.md
    - LICENSE
    - TODO.md

actions:
  pre:
    - cmd: echo "hello world"
  post:
    - cmd: git init --initial-branch=main
    - cmd: code "{project_path}"

fields:
  - id: book-name
    type: text
    required: true
    default: "{placeholder}"
    is-folder-name: true

  - id: book-author
    type: text
    required: false
    default: ""

  - id: book-genre
    type: select
    required: false
    options:
      - Fantasy
      - Fiction
      - Science Fiction
      - Science Fantasy
      - Horror
      - Mystery
      - Thriller
      - Romance
      - Historical
      - Adventure
      - Western
      - Crime
      - Drama
      - Comedy
      - Satire
      - Dystopian
      - Utopian
      - Young Adult
      - Children’s
      - Autobiography
    default: ""
    allow-custom: true
    min-cols: 2

  - id: book-genres
    type: multi-select
    required: false
    options:
      - Action
      - Adventure
      - Comedy
      - Drama
      - Romance
      - Mystery
      - Psychological
      - Political
      - Military
      - Epic
      - Dark
      - Urban
      - High Fantasy
      - Low Fantasy
      - Technofantasy
      - Sword and Sorcery
      - Space Opera
      - Hard Science Fiction
      - Science Fantasy
      - Cyberpunk
      - Steampunk
      - Biopunk
      - Post-Apocalyptic
      - Supernatural
      - Paranormal
      - Gothic
      - Survival
      - Coming-of-Age
      - Slice of Life
      - Family
      - Historical Fiction
      - Historical Fantasy
      - Philosophical
      - Religious
      - Mythological
      - Noir
      - Cozy
      - Suspense
      - Detective
      - Novel
      - Journal
      - Diary
      - Wǔxiá
      - Xiānxiá
    default: []
    allow-custom: true
    min-cols: 2

  - id: book-lang
    type: select
    required: true
    options:
      - en-US
      - en-GB
      - ru-RU
      - uk-UA
      - be-BY
      - bg-BG
      - kk-KZ
      - de-DE
      - de-CH
      - fr-FR
      - es-ES
      - is-IS
      - it-IT
      - pt-BR
      - ro-RO
      - el-GR
      - zh-CN
      - ja-JP
      - ko-KR
    default: en-US
    pattern: "^[a-z]{2,3}-[A-Z]{2}$"
    allow-custom: true
    min-cols: 2

  - id: book-add-params
    type: boolean
    required: false
    default: false

  - id: book-isbn
    type: text
    required: false
    default: 978-5-0000-0000-0
    pattern: "^((978|979)[- ]?[0-9][- ]?[0-9][- ]?[0-9][- ]?[0-9][- ]?[0-9][- ]?[0-9][- ]?[0-9][- ]?[0-9][- ]?[0-9][- ]?[0-9]|[0-9][- ]?[0-9][- ]?[0-9][- ]?[0-9][- ]?[0-9][- ]?[0-9][- ]?[0-9][- ]?[0-9][- ]?[0-9][- ]?[0-9Xx])$"
    show-if: book-add-params

  - id: book-issn
    type: text
    required: false
    default: 0000-0000
    pattern: "^[0-9]{4}-[0-9]{4}$"
    show-if: book-add-params

messages:
  book-name:
    prompt: Enter book title
    placeholder: Untitled book
  book-author:
    prompt: Enter author name
    placeholder: Anonymous
  book-lang:
    prompt: Select book locale  in ISO-639, ISO-3166 format
    option:
      label:
        en-US: English (United States)
        en-GB: English (United Kingdom)
        ru-RU: Русский (Россия)
        uk-UA: Українська (Україна)
        be-BY: Беларуская (Беларусь)
        bg-BG: Български (България)
        kk-KZ: Қазақша (Қазақстан)
        de-DE: Deutsch (Deutschland)
        de-CH: Deutsch (Schweiz)
        fr-FR: Français (France)
        es-ES: Español (España)
        is-IS: Íslenska (Ísland)
        it-IT: Italiano (Italia)
        pt-BR: Português (Brasil)
        ro-RO: Românește (Romania)
        el-GR: Ελληνικά (Ελλαδα)
        zh-CN: 中文 (中国大陆)
        ja-JP: 日本語 (日本)
        ko-KR: 한국어 (대한 고국)
  book-genre:
    prompt: Enter book genre
  book-genres:
    prompt: Select clarifying book genres
  book-add-params:
    prompt: Fill additional parameters?
  book-isbn:
    prompt: Enter ISBN
  book-issn:
    prompt: Enter ISSN

  ru:
    book-name:
      prompt: Введите название книги
      placeholder: Книга без названия
    book-author:
      prompt: Введите имя автора
      placeholder: Аноним
    book-lang:
      prompt: Выберите локализацию книги в формате ISO-639, ISO-3166
    book-genre:
      prompt: Введите жанр книги
      option:
        Fantasy: Фэнтези
        Fiction: Фантастика
        Science Fiction: Научная фантастика
        Science Fantasy: Научное фэнтези
        Horror: Ужасы
        Mystery: Мистика
        Thriller: Триллер
        Romance: Роман
        Historical: Историческая проза
        Adventure: Приключенческая проза
        Western: Вестерн
        Crime: Криминал
        Drama: Драма
        Comedy: Комедия
        Satire: Сатира
        Dystopian: Дистопия
        Utopian: Утопия
        Young Adult: Подростковая литература
        Children’s: Детская литература
        Autobiography: Автобиография
    book-genres:
      prompt: Выберите дополнительные жанры книги
      option:
        Action: Действие
        Adventure: Приключение
        Comedy: Комедия
        Drama: Драма
        Romance: Романтика
        Mystery: Мистика
        Psychological: Психология
        Political: Политика
        Military: Военная литература
        Epic: Эпическая литература
        Dark: Тёмная литература
        Urban: Городская литература
        High Fantasy: Высокое фэнтези
        Low Fantasy: Низкое фэнтези
        Technofantasy: Технофэнтези
        Sword and Sorcery: Меч и колдовство
        Space Opera: Космическая опера
        Hard Science Fiction: Твёрдая научная фантастика
        Science Fantasy: Научное фэнтези
        Cyberpunk: Киберпанк
        Steampunk: Стимпанк
        Biopunk: Биопанк
        Post-Apocalyptic: Постапокалипсис
        Supernatural: Сверхъестественное
        Paranormal: Парадоксальное
        Gothic: Готическая литература
        Survival: Выживание
        Coming-of-Age: История взросления
        Slice of Life: Ломтик жизни
        Family: Семейная литература
        Historical Fiction: Историческая фантастика
        Historical Fantasy: Историческое фэнтези
        Philosophical: Философская литература
        Religious: Религиозная литература
        Mythological: Мифологическая литература
        Noir: Нуар
        Cozy: Кози
        Suspense: Саспенс
        Detective: Детектив
        Novel: Роман
        Journal: Журнал
        Diary: Дневник
        Wǔxiá: Уся
        Xiānxiá: Сянься
    book-add-params:
      prompt: Заполнить дополнительные свойства?
    book-isbn:
      prompt: Введите ISBN
    book-issn:
      prompt: Введите ISSN

targets:
  - file: /meta/book.yml
    format: yaml
    fields:
      - value: ${UUID}
        key: book.uuid
      - field: book-name
        key: book.title
      - field: book-author
        key: author[0].name
      - field: book-lang
        key: property.locale
      - value: © {book-author}
        key: copyright.notice
      - field: book-genre
        fallback: ${NULL}
        key: property.genre
      - field: book-genres
        fallback: ${NULL}
        key: property.genres
      # - value: ${NULL}
      #   key: book.series
      # - value: ${NULL}
      #   key: book.cycle
      # - value: ${NULL}
      #   key: book.volume-title
      # - value: ${NULL}
      #   key: book.volume
      # - value: ${NULL}
      #   key: book.description
      - value: ${YEAR}
        key: date.year
      - value: ${MONTH}
        key: date.month
      - value: ${DAY}
        key: date.day
      - field: book-isbn
        key: property.ISBN
      - field: book-issn
        key: property.ISSN
