# yaml-language-server: $schema=draft_2020-12/schema.json
# prettier-ignore
$schema: ./draft_2020-12/schema.json
title: Typst Paragraph Configuration

type: object
propertyNames:
  description: Name of the property or mode.
  pattern: ^[a-z][a-z0-9_-]*$

properties:
  leading:
    $ref: "#/$defs/style/properties/leading"
  spacing:
    $ref: "#/$defs/style/properties/spacing"
  justify:
    $ref: "#/$defs/style/properties/justify"
  justification-limits:
    $ref: "#/$defs/style/properties/justification-limits"
  linebreaks:
    $ref: "#/$defs/style/properties/linebreaks"
  first-line-indent:
    $ref: "#/$defs/style/properties/first-line-indent"
  hanging-indent:
    $ref: "#/$defs/style/properties/hanging-indent"
  body:
    $ref: "#/$defs/style/properties/body"

additionalProperties:
  $ref: "#/$defs/style"

$defs:
  style:
    description: Набор свойств. Используется и для плоской записи, и внутри режима.
    type: object
    additionalProperties: false
    properties:
      leading:
        description: The vertical space between lines of text.
        type: string
        pattern: ^[0-9]+(\.[0-9]+)?(pt|em|cm|mm|in)$

      spacing:
        description: The spacing between paragraphs.
        type: string
        pattern: ^[0-9]+(\.[0-9]+)?(pt|em|cm|mm|in|%)$

      justify:
        description: Whether the paragraph should be justified.
        type: boolean

      justification-limits:
        description: How much the spacing between words and characters may be adjusted during justification.
        type: object

      linebreaks:
        description: How to determine line breaks.
        oneOf:
          - type: string
            enum: [auto, simple, optimized]
          - type: object

      first-line-indent:
        description: The indent the first line of a paragraph should have.
        oneOf:
          - type: string
            pattern: ^[0-9]+(\.[0-9]+)?(pt|em|cm|mm|in)$
          - type: object

      hanging-indent:
        description: The indent that all but the first line of a paragraph should have.
        type: string
        pattern: ^[0-9]+(\.[0-9]+)?(pt|em|cm|mm|in)$

      body:
        description: The content of the paragraph.
        oneOf:
          - type: string
          - type: object
