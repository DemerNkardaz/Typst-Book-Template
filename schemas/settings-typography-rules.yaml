# yaml-language-server: $schema=draft_2020-12/schema.json
$schema: ./draft_2020-12/schema.json
title: Text Processing Configuration
type: object
required: [storage, rules]
additionalProperties: false

properties:
  locales:
    type: array
    description: Available locale profile names, corresponding to <locale>.yml files.
    items:
      type: string
      pattern: '^[A-Za-z0-9]+(?:-[A-Za-z0-9]+)*$'

  storage:
    type: object
    description: Named lists of strings (any set of keys)
    additionalProperties:
      type: array
      items: { type: string }

  rules:
    type: array
    description: List of text processing rules
    items:
      type: array
      description: A text processing rule
      items:
        type: string
        description: "Text processing rule: [regex, replacement, condition?]"
      prefixItems:
        - type: string
          description: Regex pattern
        - type: string
          description: Replacement
        - type: string
          description: Optional condition
      minItems: 2
      maxItems: 3
